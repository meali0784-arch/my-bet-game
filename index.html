    document.head.appendChild(styleTag);

    document.body.style.margin = "0";
    var mount = document.createElement("div");
    mount.innerHTML = `

                <h4>Team B</h4>

                    <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                </div>
                <button class="roll-btn" id="roll_dice_2" disabled>Roll Dice</button>
                <br>
                <button class="bonus-btn" id="bonus_btn_2">Spin Bonus Wheel</button>
            </div>

        <div class="wheel-section">
            <h3>Bonus Wheel</h3>
            <p class="sub">Roll a six to unlock a free spin for extra points</p>
            <div class="wheel-wrap">
                <div class="pointer"></div>
                <svg class="wheel" id="wheel" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="110" cy="110" r="106" fill="#0a0a0a"></circle>
                </svg>

            <div class="wheel-result" id="wheel_result"></div>

        <div class="banner" id="banner"></div>
        <button class="reset" id="reset_btn" style="display:none;">Play Again</button>
    </div>
    `;
    document.body.appendChild(mount);

    let total_number_1 = document.getElementById("total_number_1")
        let dice_1 = document.getElementById("dice_1")
        let roll_dice_1 = document.getElementById("roll_dice_1")
        let total_number_2 = document.getElementById("total_number_2")
        let dice_2 = document.getElementById("dice_2")
        let roll_dice_2 = document.getElementById("roll_dice_2")
        let teamA_turns = document.getElementById("teamA_turns")
        let teamB_turns = document.getElementById("teamB_turns")
        let cardA = document.getElementById("cardA")
        let cardB = document.getElementById("cardB")
        let banner = document.getElementById("banner")
        let reset_btn = document.getElementById("reset_btn")
        let bonus_btn_1 = document.getElementById("bonus_btn_1")
        let bonus_btn_2 = document.getElementById("bonus_btn_2")
        let wheel = document.getElementById("wheel")
        let wheel_result = document.getElementById("wheel_result")
        let balance_val = document.getElementById("balance_val")
        let pickA = document.getElementById("pickA")
        let pickB = document.getElementById("pickB")
        let chipBtns = document.querySelectorAll(".chip-btn")
        let place_bet_btn = document.getElementById("place_bet_btn")
        let preview_stake = document.getElementById("preview_stake")
        let preview_payout = document.getElementById("preview_payout")
        let active_bet_note = document.getElementById("active_bet_note")
        let slip = document.getElementById("slip")

        let turnOf = "A"
        const MAX_TURNS = 5
        const ODDS = 1.95
        let wheelRotation = 0
        let wheelBusy = false

        let balance = 1000
        let bet = { team: null, stake: 0, placed: false }

        const pipMap = {
            1: [4],
            2: [0, 8],
            3: [0, 4, 8],
            4: [0, 2, 6, 8],
            5: [0, 2, 4, 6, 8],
            6: [0, 2, 3, 5, 6, 8]
        }

        const wheelSegments = [
            { label: "+2", value: 2, color: "#2f6f4e" },
            { label: "+5", value: 5, color: "#3ea6e0" },
            { label: "+1", value: 1, color: "#ffd873" },
            { label: "JACKPOT +10", value: 10, color: "#e0475a" },
            { label: "+3", value: 3, color: "#2f6f4e" },
            { label: "+1", value: 1, color: "#3ea6e0" },
            { label: "+4", value: 4, color: "#ffd873" },
            { label: "+2", value: 2, color: "#e0475a" }
        ]

        let buildWheel = () => {
            let cx = 110, cy = 110, r = 106
            let segAngle = 360 / wheelSegments.length
            let svgParts = ['<circle cx="110" cy="110" r="106" fill="#0a0a0a"></circle>']

            wheelSegments.forEach((seg, i) => {
                let startAngle = i * segAngle - 90
                let endAngle = startAngle + segAngle
                let startRad = startAngle * Math.PI / 180
                let endRad = endAngle * Math.PI / 180
                let x1 = cx + r * Math.cos(startRad)
                let y1 = cy + r * Math.sin(startRad)
                let x2 = cx + r * Math.cos(endRad)
                let y2 = cy + r * Math.sin(endRad)
                let path = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`
                svgParts.push(`<path d="${path}" fill="${seg.color}" stroke="#0a0a0a" stroke-width="2"></path>`)

                let midAngle = startAngle + segAngle / 2
                let midRad = midAngle * Math.PI / 180
                let tx = cx + (r * 0.62) * Math.cos(midRad)
                let ty = cy + (r * 0.62) * Math.sin(midRad)
                svgParts.push(`<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#0a0a0a" font-size="12" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle" dominant-baseline="middle" transform="rotate(${(midAngle + 90).toFixed(2)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${seg.label}</text>`)
            })

            wheel.innerHTML = svgParts.join("")
        }

        buildWheel()

        let updateBalanceDisplay = () => {
            balance_val.innerHTML = balance
        }

        let updateSlipPreview = () => {
            preview_stake.innerHTML = bet.stake
            preview_payout.innerHTML = bet.stake > 0 ? Math.round(bet.stake * ODDS) : 0
            place_bet_btn.disabled = !(bet.team && bet.stake > 0)
        }

        pickA.addEventListener('click', () => {
            bet.team = "A"
            pickA.classList.add("picked")
            pickB.classList.remove("picked")
            updateSlipPreview()
        })

        pickB.addEventListener('click', () => {
            bet.team = "B"
            pickB.classList.add("picked")
            pickA.classList.remove("picked")
            updateSlipPreview()
        })

        chipBtns.forEach(chip => {
            chip.addEventListener('click', () => {
                let stakeVal = +chip.dataset.stake
                if (stakeVal > balance) return
                bet.stake = stakeVal
                chipBtns.forEach(c => c.classList.remove("picked"))
                chip.classList.add("picked")
                updateSlipPreview()
            })
        })

        place_bet_btn.addEventListener('click', () => {
            if (!bet.team || bet.stake <= 0 || bet.stake > balance) return
            balance -= bet.stake
            bet.placed = true
            updateBalanceDisplay()

            place_bet_btn.disabled = true
            pickA.style.pointerEvents = "none"
            pickB.style.pointerEvents = "none"
            chipBtns.forEach(c => c.style.pointerEvents = "none")
            slip.style.opacity = "0.6"

            active_bet_note.innerHTML = `Bet placed: ${bet.stake} coins on Team ${bet.team} to win ${Math.round(bet.stake * ODDS)}`
            active_bet_note.classList.add("show")

            roll_dice_1.disabled = false
        })

        let generateNumber = () => {
            let random = Math.random() * 6
            random = Math.ceil(random)
            return random
        }

        let showFace = (diceEl, number) => {
            let pips = diceEl.querySelectorAll(".pip")
            pips.forEach(p => p.style.opacity = 0)
            pipMap[number].forEach(i => pips[i].style.opacity = 1)
        }

        let animateRoll = (diceEl, finalNumber, onDone) => {
            diceEl.classList.add("rolling")
            let ticks = 0
            let spin = setInterval(() => {
                showFace(diceEl, generateNumber())
                ticks++
                if (ticks > 8) {
                    clearInterval(spin)
                    diceEl.classList.remove("rolling")
                    showFace(diceEl, finalNumber)
                    onDone()
                }
            }, 60)
        }

        let spinWheel = (team) => {
            if (wheelBusy) return
            wheelBusy = true
            bonus_btn_1.disabled = true
            bonus_btn_2.disabled = true

            let segAngle = 360 / wheelSegments.length
            let winningIndex = Math.floor(Math.random() * wheelSegments.length)
            let targetAngle = 360 - (winningIndex * segAngle + segAngle / 2)
            let fullSpins = 5 * 360
            wheelRotation += fullSpins + targetAngle - (wheelRotation % 360)

            wheel.style.transform = `rotate(${wheelRotation}deg)`
            wheel_result.innerHTML = "Spinning..."

            setTimeout(() => {
                let won = wheelSegments[winningIndex]
                wheel_result.innerHTML = `Team ${team} wins ${won.label} bonus points!`
                if (team === "A") {
                    total_number_1.innerHTML = +total_number_1.innerHTML + won.value
                } else {
                    total_number_2.innerHTML = +total_number_2.innerHTML + won.value
                }
                wheelBusy = false
                bonus_btn_1.classList.remove("show")
                bonus_btn_2.classList.remove("show")
                checkWinner()
            }, 4600)
        }

        bonus_btn_1.addEventListener('click', () => spinWheel("A"))
        bonus_btn_2.addEventListener('click', () => spinWheel("B"))

        let settleBet = (scoreA, scoreB) => {
            if (!bet.placed) return ""
            if (scoreA === scoreB) {
                balance += bet.stake
                updateBalanceDisplay()
                return `Push &mdash; scores tied, your ${bet.stake} coin stake was refunded.`
            }
            let winningTeam = scoreA > scoreB ? "A" : "B"
            if (bet.team === winningTeam) {
                let payout = Math.round(bet.stake * ODDS)
                balance += payout
                updateBalanceDisplay()
                return `Your bet on Team ${bet.team} won! Payout: ${payout} coins.`
            } else {
                return `Your bet on Team ${bet.team} lost. Stake of ${bet.stake} coins forfeited.`
            }
        }

        let checkWinner = () => {
            let turnsA = +teamA_turns.innerHTML
            let turnsB = +teamB_turns.innerHTML
            if (turnsA >= MAX_TURNS && turnsB >= MAX_TURNS) {
                let scoreA = +total_number_1.innerHTML
                let scoreB = +total_number_2.innerHTML
                roll_dice_1.disabled = true
                roll_dice_2.disabled = true
                bonus_btn_1.classList.remove("show")
                bonus_btn_2.classList.remove("show")
                cardA.classList.remove("active")
                cardB.classList.remove("active")

                let resultLine
                if (scoreA === scoreB) {
                    resultLine = `It's a tie! Both teams scored ${scoreA}`
                } else {
                    let winner = scoreA > scoreB ? "Team A" : "Team B"
                    resultLine = `${winner} wins with ${Math.max(scoreA, scoreB)} points!`
                }
                let payoutLine = settleBet(scoreA, scoreB)
                banner.innerHTML = `${resultLine}<span class="payout-line">${payoutLine}</span>`
                banner.classList.add("show")
                reset_btn.style.display = "block"
                return true
            }
            return false
        }

        let rollDice = () => {
            if (turnOf == "A") {
                roll_dice_1.disabled = true
                let diceResult = generateNumber()
                animateRoll(dice_1, diceResult, () => {
                    total_number_1.innerHTML = +total_number_1.innerHTML + diceResult
                    teamA_turns.innerHTML = +teamA_turns.innerHTML + 1

                    if (checkWinner()) return

                    if (diceResult === 6) {
                        bonus_btn_1.classList.add("show")
                        bonus_btn_1.disabled = false
                    }

                    turnOf = "B"
                    cardA.classList.remove("active")
                    cardB.classList.add("active")
                    roll_dice_2.disabled = false
                })
            } else {
                roll_dice_2.disabled = true
                let diceResult = generateNumber()
                animateRoll(dice_2, diceResult, () => {
                    total_number_2.innerHTML = +total_number_2.innerHTML + diceResult
                    teamB_turns.innerHTML = +teamB_turns.innerHTML + 1

                    if (checkWinner()) return

                    if (diceResult === 6) {
                        bonus_btn_2.classList.add("show")
                        bonus_btn_2.disabled = false
                    }

                    turnOf = "A"
                    cardB.classList.remove("active")
                    cardA.classList.add("active")
                    roll_dice_1.disabled = false
                })
            }
        }

        let resetGame = () => {
            total_number_1.innerHTML = 0
            total_number_2.innerHTML = 0
            teamA_turns.innerHTML = 0
            teamB_turns.innerHTML = 0
            showFace(dice_1, 1)
            showFace(dice_2, 1)
            dice_1.querySelectorAll(".pip").forEach(p => p.style.opacity = 0)
            dice_2.querySelectorAll(".pip").forEach(p => p.style.opacity = 0)
            turnOf = "A"
            roll_dice_1.disabled = true
            roll_dice_2.disabled = true
            bonus_btn_1.classList.remove("show")
            bonus_btn_2.classList.remove("show")
            wheel_result.innerHTML = ""
            cardA.classList.add("active")
            cardB.classList.remove("active")
            banner.classList.remove("show")
            reset_btn.style.display = "none"

            bet = { team: null, stake: 0, placed: false }
            pickA.classList.remove("picked")
            pickB.classList.remove("picked")
            chipBtns.forEach(c => c.classList.remove("picked"))
            pickA.style.pointerEvents = "auto"
            pickB.style.pointerEvents = "auto"
            chipBtns.forEach(c => c.style.pointerEvents = "auto")
            slip.style.opacity = "1"
            active_bet_note.classList.remove("show")
            updateSlipPreview()
        }

        roll_dice_1.addEventListener('click', rollDice)
        roll_dice_2.addEventListener('click', rollDice)
        reset_btn.addEventListener('click', resetGame)

})();
</script>
</body>
</html>
